<!doctype html>
<html lang="bn" class="dark bg-[#0c0e12]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CinePulse HD — iPhone Cinema & Anime Portal</title>
    <script>
      // Redirect any 404 path on GitHub Pages back to the root SPA preserving query parameters
      (function () {
        var l = window.location;
        var repoBase = l.pathname.split('/').slice(0, 2).join('/');
        var search = l.search || '';
        var hash = l.hash || '';
        l.replace(l.origin + repoBase + '/' + search + hash);
      })();
    </script>
  </head>
  <body class="bg-[#0c0e12] text-slate-100"></body>
</html>
